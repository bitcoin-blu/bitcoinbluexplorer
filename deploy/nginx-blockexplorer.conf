map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=bblu_broadcast:10m rate=1r/s;

server {
    listen 80;
    server_name blockexplorer.bitcoin-blu.org;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name blockexplorer.bitcoin-blu.org;

    ssl_certificate     /etc/letsencrypt/live/blockexplorer.bitcoin-blu.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blockexplorer.bitcoin-blu.org/privkey.pem;

    client_max_body_size 8m;

    location = /api/tx {
        limit_req zone=bblu_broadcast burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
